name: Wasm API

on:
  workflow_dispatch:
    inputs:
      performance:
        description: Also build a release engine and run performance benchmarks
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/wasm.yml"
      - "rts/NativeInterface/**"
      - "rts/Lua/**"
      - "rts/WasmInterface/**"
      - "rts/wasm/**"
      - "CMakeLists.txt"
      - "rts/CMakeLists.txt"
      - "rts/Game/**"
      - "rust/**"
      - "test/CMakeLists.txt"
      - "test/wasm_api/**"
      - "test/native_api_parity/**"
      - "test/native_stub_regressions/**"
      - "docker-build-v2/**"
  push:
    branches:
      - main
      - master
      - rust-wip
    paths:
      - ".github/workflows/wasm.yml"
      - "rts/NativeInterface/**"
      - "rts/Lua/**"
      - "rts/WasmInterface/**"
      - "rts/wasm/**"
      - "CMakeLists.txt"
      - "rts/CMakeLists.txt"
      - "rts/Game/**"
      - "rust/**"
      - "test/CMakeLists.txt"
      - "test/wasm_api/**"
      - "test/native_api_parity/**"
      - "test/native_stub_regressions/**"
      - "docker-build-v2/**"

permissions:
  contents: read

jobs:
  # Automatic pushes/PRs run only source generation and Rust checks.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install --yes libclang-18-dev

      - name: Locate libclang
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Test Rust workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Check generated Wasm artifacts
        run: python3 rts/wasm/verify_codegen.py

      - name: Check native generated snapshot
        run: |
          SPRING_NATIVE_REGENERATE=1 cargo build --manifest-path rust/Cargo.toml -p spring-native --lib
          python3 rust/crates/spring-native-codegen/snapshot_native.py --root . --check

      # verify_codegen.py already regenerates every Core probe context in a
      # temporary tree using fresh metadata; no checkout model.json is needed.
      - name: Check native parity generated artifacts
        run: |
          python3 test/native_api_parity/generate_from_spec.py
          git diff --exit-code -- \
            test/native_api_parity/native/src/generated_tests.rs \
            test/native_api_parity/fixtures/game.sdd/LuaRules/Utilities/generated_api_tests.lua

  # Full engine builds are expensive and consume Actions minutes. Opt in
  # through workflow_dispatch; a push never starts these jobs.
  integration:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install libclang and native regression dependencies
        run: sudo apt-get update && sudo apt-get install --yes libclang-18-dev libsdl2-dev libjsoncpp-dev libgl-dev libgl1-mesa-dri python3-clang-18 libopenal-dev libfreetype-dev libfontconfig-dev libogg-dev libvorbis-dev libopus-dev libminizip-dev libunwind-dev

      - name: Locate libclang
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      # The snapshot verifier generates into a temporary tree. The native
      # implementation audit and mutant generator below require fresh metadata
      # in the checkout, including ignored model.json on a clean runner.
      - name: Generate native audit metadata
        run: cargo run --manifest-path rust/Cargo.toml -p spring-native-codegen --bin spring-api-codegen -- --root . --output rts/wasm/generated --strict

      - name: Build engine and Wasm tests with ASAN
        run: ./docker-build-v2/build.sh linux -DUSE_ASAN=ON -DNATIVE_API_TEST_HOOKS=ON

      - name: Audit native implementations and generated mutants
        run: |
          ninja -C build-amd64-linux -t compdb > "$RUNNER_TEMP/native-commands.json"
          /usr/bin/python3 rts/wasm/check_native_stubs.py --commands "$RUNNER_TEMP/native-commands.json"
          /usr/bin/python3 -m unittest discover -s rts/wasm/tests -p 'test_native_stub_*.py'
          python3 test/native_api_parity/generate_mutants.py --check
          python3 -m unittest discover -s test/native_api_parity/tests -v

      - name: Run engine tests
        run: ./docker-build-v2/build.sh --compile linux -t check

      - name: Run native parity fixture
        run: |
          python3 test/native_api_parity/run_harness.py \
            --mode both \
            --cases 3 \
            --timeout 180 \
            --skip-callin-compare \
            --output-dir test/native_api_parity/out-ci-native

      - name: Reject native stub regressions with non-default values
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "1"
        run: |
          python3 test/native_stub_regressions/run.py --output test/native_api_parity/out-ci-stub-regressions
          python3 test/native_api_parity/parity_ledger.py --native-audit-log test/native_api_parity/out-ci-stub-regressions/spring.log --gate --output "$RUNNER_TEMP/parity-ledger.json"

      - name: Run Wasm parity fixture
        run: |
          python3 test/native_api_parity/run_harness.py \
            --mode wasm \
            --cases 3 \
            --timeout 180 \
            --output-dir test/native_api_parity/out-ci-wasm

  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    runs-on: ubuntu-24.04
    needs: integration
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build the non-ASAN performance configuration
        run: ./docker-build-v2/build.sh linux -DUSE_ASAN=OFF -DCMAKE_BUILD_TYPE=RELEASE

      - name: Enforce Wasm frame-budget benchmark
        run: ./docker-build-v2/build.sh --compile linux -t wasm-performance
