[package]
name = "recoil-wasm-parity-guest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
core = []
core_rules_synced = []
core_rules_unsynced = []
core_gaia_synced = []
core_gaia_unsynced = []
core_ui = []

[dependencies]
wit-component = "0.254.0"
wit-bindgen = "0.60.0"
spring-wasm-core = { path = "../../../rust/crates/spring-wasm-core", features = ["alloc"] }

[[bin]]
name = "componentize"
path = "src/bin/componentize.rs"
