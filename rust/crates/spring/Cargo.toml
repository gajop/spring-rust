[package]
name = "spring"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Enables owned Vec-returning convenience APIs. The zero-allocation `_into`
# variants remain available in pure no_std builds without this feature.
alloc = []

[dependencies]
libm = "0.2"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[lib]
path = "src/lib.rs"
