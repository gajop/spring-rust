[package]
name = "spring-sdk"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"

[dependencies]
spring = { path = "../spring", features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spring-native-sys = { path = "../spring-native-sys" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
too_many_arguments = "allow"
