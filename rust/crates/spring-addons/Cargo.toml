[package]
name = "spring-addons"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["std"]
# Enables the engine-logging panic hook, which needs `std::panic::set_hook`.
std = []

[dependencies]
spring = { path = "../spring", features = ["alloc"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[lib]
path = "src/lib.rs"
