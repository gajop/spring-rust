[package]
name = "spring-native-codegen"
version = "0.1.0"
edition = "2024"
description = "Code generator for Spring NativeInterface Rust bindings"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0"
heck = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Match bindgen's clang-sys mode on every target. Otherwise feature unification
# can enable runtime symbols without Clang::new loading them on Windows.
clang = { version = "2.0", features = ["runtime"] }
