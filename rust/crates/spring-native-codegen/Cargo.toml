[package]
name = "spring-native-codegen"
version = "0.1.0"
edition = "2021"
description = "Code generator for Spring NativeInterface Rust bindings"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0"
heck = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
clang = "2.0"

[target.'cfg(not(windows))'.dependencies]
clang = { version = "2.0", features = ["runtime"] }
